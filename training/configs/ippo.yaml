# IPPO training configuration (Week 2: runnable RLlib training).
#
# Independent PPO is the baseline algorithm next to MAPPO.
#
#   python -m training.train_ippo --config training/configs/ippo.yaml
#   python -m training.train_ippo --print-config   # configuration only

algorithm: IPPO
env: swarm
framework: torch
seed: 42
checkpoint_dir: training/checkpoints

env_config:
  agent_count: 50
  world_size: [100.0, 50.0, 100.0]
  seed: 42
  dt: 0.1
  max_steps: 500
  max_speed: 5.0
  max_pitch: 0.6
  collision_radius: 1.5
  lidar_rays: 8
  coverage_cell_size: 5.0

model:
  fcnet_hiddens: [256, 256]
  fcnet_activation: relu

multi_agent:
  # Independent actors share one policy definition; every agent maps
  # to `policy_id` through `map_agent_to_policy` in training/rl_config.py.
  policy_id: swarm_policy
  policy_mapping_fn: all_agents_same_policy

train:
  # Trainer and environment run in this process. Raise num_env_runners
  # to move rollouts onto Ray actors.
  num_env_runners: 0
  train_batch_size: 1000
  minibatch_size: 256
  num_epochs: 10
  num_iterations: 2
  lr: 0.0003
  gamma: 0.99
  lambda_: 0.95
  clip_param: 0.2
  entropy_coeff: 0.01
  vf_loss_coeff: 0.5
